name: Build Wavelength IPA v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Clone official Dev-Siri Wavelength source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.2.3 https://github.com/Dev-Siri/wavelength.git source
          cd source
          git rev-parse --short HEAD
          git describe --tags --always

      - name: Recover production config from official Wavelength APK
        shell: bash
        run: |
          set -euo pipefail

          APK_URL="https://github.com/Dev-Siri/wavelength/releases/download/v1.2.3/app-release.apk"
          curl -fL --retry 3 --retry-delay 2 "$APK_URL" -o /tmp/wavelength.apk

          ENV_PATH="$(unzip -Z1 /tmp/wavelength.apk | awk '/(^|\/)\.env$/ { print; exit }')"
          if [[ -z "${ENV_PATH}" ]]; then
            echo "::error::Could not find the bundled .env inside the official APK."
            exit 1
          fi

          unzip -p /tmp/wavelength.apk "$ENV_PATH" > source/apps/mobile/.env

          for key in API_GATEWAY_URL PLAYER_GATEWAY_URL WEB_GOOGLE_CLIENT_ID IOS_GOOGLE_CLIENT_ID; do
            if ! grep -q "^${key}=" source/apps/mobile/.env; then
              echo "::error::Required key ${key} is missing from the recovered .env."
              exit 1
            fi
          done

          echo "Recovered production runtime configuration."

      - name: Install Wavelength Flutter revision
        shell: bash
        run: |
          set -euo pipefail

          FLUTTER_REV="$(awk -F'"' '/revision:/ { print $2; exit }' source/apps/mobile/.metadata)"
          if [[ -z "${FLUTTER_REV}" ]]; then
            echo "::error::Could not determine Flutter revision from apps/mobile/.metadata."
            exit 1
          fi

          git clone https://github.com/flutter/flutter.git --depth 1 "$HOME/flutter"
          git -C "$HOME/flutter" fetch --depth 1 origin "$FLUTTER_REV"
          git -C "$HOME/flutter" checkout --detach FETCH_HEAD

          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          echo "$HOME/flutter/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"

      - name: Verify Flutter and Xcode
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          xcodebuild -version
          flutter config --no-analytics

      - name: Prepare Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          rustup target add aarch64-apple-ios

      - name: Install CocoaPods if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi
          pod --version

      - name: Get Flutter dependencies
        working-directory: source/apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      - name: Build unsigned iOS app
        working-directory: source/apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="source/apps/mobile/build/ios/iphoneos/Runner.app"
          if [[ ! -d "$APP" ]]; then
            echo "::error::Runner.app was not produced."
            exit 1
          fi

          OUT="$RUNNER_TEMP/wavelength-ipa"
          mkdir -p "$OUT/Payload"
          ditto "$APP" "$OUT/Payload/Runner.app"

          cd "$OUT"
          /usr/bin/zip -qry Wavelength-unsigned.ipa Payload

          test -s Wavelength-unsigned.ipa
          echo "IPA_PATH=$OUT/Wavelength-unsigned.ipa" >> "$GITHUB_ENV"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Wavelength-iOS-unsigned
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14
